name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dashboard
        working-directory: internal/hub/site
        run: |
          npm install
          npm run build

      - name: Build hub
        run: go build -o /dev/null .

      - name: Test hub
        run: go test ./... -v -count=1

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent deps
        run: |
          pip install "mitmproxy>=11.1,<13"
          pip install "pytest>=8" "aiohttp" "websockets" "asyncio-throttle"

      - name: Lint
        run: pip install ruff && ruff check --ignore=E501,F401,E402 .

      - name: Test agent
        run: python -m pytest tests/ -v
