[project]
name = "mitm-agent"
version = "0.1.0"
description = "mitmproxy agent for mitm-decentralized hub"
requires-python = ">=3.11"
dependencies = [
    "mitmproxy>=10",
    "pocketbase>=0.14",
    "websockets>=12",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
