name: mitmix

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.agent
    restart: unless-stopped
    ports:
      - "8082:8082"
    command: ["--hub", "ws://hub:8090", "--token", "test-agent-token", "--listen", "0.0.0.0:8082"]
    depends_on:
      - hub

volumes:
  pb_data:
