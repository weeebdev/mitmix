services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.agent
    restart: unless-stopped
    network_mode: host
    command: ["--hub", "ws://localhost:8090", "--token", "test-agent-token"]
    depends_on:
      - hub

volumes:
  pb_data:
