name: mitmix

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    environment:
      - FLOW_RETENTION_HOURS=${FLOW_RETENTION_HOURS:-24}
      - HUB_TLS_CERT=${HUB_TLS_CERT:-}
      - HUB_TLS_KEY=${HUB_TLS_KEY:-}
      - HUB_HTTPS=${HUB_HTTPS:-}

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.agent
    restart: unless-stopped
    ports:
      - "8082:8082"
    command: ["--hub", "ws://hub:8090", "--token", "test-agent-token", "--listen", "0.0.0.0:8082"]
    depends_on:
      - hub

volumes:
  pb_data:
