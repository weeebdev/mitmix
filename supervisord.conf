[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:hub]
command=hub serve --http 0.0.0.0:8090 --dir /pb_data
directory=/
environment=HUB_ADMIN_EMAIL="%(ENV_HUB_ADMIN_EMAIL)s",HUB_ADMIN_PASSWORD="%(ENV_HUB_ADMIN_PASSWORD)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=unexpected

[program:agent]
command=python -u /agent/mitm_agent.py --hub ws://127.0.0.1:8090 --token %(ENV_AGENT_TOKEN)s --listen 0.0.0.0:8082
directory=/agent
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=unexpected
depends_on=hub
